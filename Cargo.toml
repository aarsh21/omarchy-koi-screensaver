[package]
name = "koi-screensaver"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
description = "ASCII/ANSI koi pond screensaver for Omarchy, ported from the koi pond on dao-ho's portfolio"

[lib]
name = "koi_screensaver"
path = "src/lib.rs"

[[bin]]
name = "koi-screensaver"
path = "src/main.rs"

[dependencies]
cairo-rs = { version = "0.18.5", default-features = false }
sdl3 = { version = "0.20", features = ["use-pkg-config"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
